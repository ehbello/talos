# Fork-only CI: builds THIS fork's imager container -- which carries the
# measured-DTB-in-UKI feature (a measured UKI .dtb section, overlay-supplied
# device trees, dtc/fdtoverlay bundled) -- and PUSHES it to ghcr, on a native
# arm64 runner. It does NOT use siderolabs self-hosted runners or remote
# BuildKit, so it works on the fork.
#
# Division of labour: CI builds the slow, per-repo images (this imager, and the
# sbc-rockchip overlay in its own repo). The raw metal image to flash is then
# assembled LOCALLY from the published imager + overlay (see siderolabs/build.sh)
# as often as needed, without rebuilding anything here.
#
# PKG_DTC is overridden to a PUBLISHED dtc pkg (provides fdtoverlay): the pinned
# PKGS predates the dtc package and the Dockerfile default is `scratch`, so
# without this the imager has no fdtoverlay and the DTB overlay merge fails.
#
# The pushed tag is `git describe` of the built commit, so a local build.sh on
# that same commit resolves the same imager tag. Trigger with workflow_dispatch
# (preferred) or by pushing a `*-image-build` branch. Keep this workflow OFF the
# PR branch feature/uki-dtb-section.

name: fork-imager-build

"on":
  workflow_dispatch:
    inputs:
      pkg_dtc:
        description: "dtc pkg image providing fdtoverlay"
        type: string
        default: "ghcr.io/siderolabs/dtc:v1.15.0-alpha.0-13-gb6b2843"
  push:
    branches:
      - "**-image-build"

concurrency:
  group: fork-imager-build-${{ github.ref }}
  cancel-in-progress: true

env:
  USERNAME: ${{ github.repository_owner }}
  PLATFORM: linux/arm64
  PKG_DTC: ghcr.io/siderolabs/dtc:v1.15.0-alpha.0-13-gb6b2843

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Unshallow for git describe
        run: git fetch --prune --unshallow || true

      - name: Resolve config
        id: cfg
        run: |
          echo "pkg_dtc=${{ github.event.inputs.pkg_dtc || env.PKG_DTC }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the fork imager (arm64, with fdtoverlay)
        run: |
          make imager \
            PUSH=true \
            PLATFORM=linux/arm64 \
            USERNAME=${{ github.repository_owner }} \
            PKG_DTC=${{ steps.cfg.outputs.pkg_dtc }}
          echo "pushed ghcr.io/${{ github.repository_owner }}/imager:$(git describe --tag --always --dirty --match 'v[0-9]*')"
